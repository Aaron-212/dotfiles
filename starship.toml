### Right prompts

# TODO: Wait for conditional styling support
[status]
style = 'bg:red fg:bright-white'
symbol = "ERROR"
success_symbol = ""
not_executable_symbol = "NOT EXEC"
not_found_symbol = "NOT FOUND"
sigint_symbol = "SIGINT"
format = ' [](red)[$symbol(@$status_number)]($style)[](red)'
map_symbol = true
disabled = false

[cmd_duration]
style = "bg:bright-black fg:bright-white"
min_time = 1000
format = ' [](bright-black)[$duration]($style)[](bright-black)'
disabled = false

[time]
disabled = false
style = "bg:bright-black fg:bright-white"
format = ' [](bright-black)[$time]($style)[](bright-black)'
