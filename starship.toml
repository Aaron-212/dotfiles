"$schema" = 'https://starship.rs/config-schema.json'

format = """$username$hostname${env_var.VIRTUAL_ENV_PROMPT}\
$directory$git_branch$git_commit$git_state$git_status\
$package$all$fill\
$status$cmd_duration$time\n\
$character"""

[line_break]
disabled = true

[fill]
symbol = ' '

[env_var.VIRTUAL_ENV_PROMPT]
format = '[](cyan)[VENV ](fg:bright-white bg:cyan)[ $env_value](fg:bright-white bg:bright-black)[](bright-black) '

[shell]
style = 'fg:black bg:cyan'
format = '[](cyan)[$indicator]($style)[](cyan) '
disabled = true

[directory]
style = 'fg:bright-white bg:bright-black'
format = '[](bright-black)[$read_only]($read_only_style)[$path]($style)[](bright-black) '
truncation_length = 0

before_repo_root_style = 'fg:bright-white bg:purple'
repo_root_style = 'fg:bright-white bg:bright-black'
repo_root_format = '[](purple)[$read_only]($read_only_style)[git $before_root_path]($before_repo_root_style)[ $repo_root]($repo_root_style)[$path]($style)[](bright-black) '
read_only = "ReadOnly "
read_only_style = "fg:bright-red bg:bright-black"
use_os_path_sep = false

[git_branch]
style = 'fg:bright-white bg:purple'
format = '[](purple)[#$branch(:$remote_branch) ]($style)'
truncation_length = 16

[git_commit]
style = 'fg:bright-white bg:cyan'
format = '[ $hash ]($style)'

[git_state]
style = 'fg:bright-white bg:cyan'
format = '[ $state( $progress_current/$progress_total) ]($style)'

[git_status]
ahead = "↑$count"
behind = "↓$count"
diverged = "↑$ahead_count↓$behind_count"
up_to_date = "✓"
renamed = "→"
deleted = "✗"
stashed = "\\$$count"
style = 'fg:bright-white bg:blue'
format = '([ $all_status$ahead_behind]($style))[](blue) '

[username]
style_user = 'fg:bright-white bg:bright-black'
style_root = 'fg:bright-red bg:bright-black'
format = '[](bright-black)[$user]($style)[](bright-black) '
disabled = false

[hostname]
style = 'fg:black bg:cyan'
format = '[](cyan)[@$hostname]($style)[](cyan) '

[package]
format = '[](cyan)[v$version](fg:black bg:cyan)[](cyan) '
version_format = '${raw}'

