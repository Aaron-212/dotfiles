"$schema" = 'https://starship.rs/config-schema.json'

format = '''$shell$username$hostname$status$cmd_duration$directory$git_branch$git_state$git_status$package$all'''

add_newline = true

[shell]
style = 'fg:black bg:cyan'
format = '[](cyan)[$indicator]($style)[](cyan)'
disabled = false

[directory]
style = 'fg:bright-white bg:bright-black'
format = ' [](bright-black)[$read_only]($read_only_style)[$path]($style)[](bright-black)'
truncation_length = 0

before_repo_root_style = 'fg:bright-white bg:purple'
repo_root_style = 'fg:bright-white bg:bright-black'
repo_root_format = ' [](purple)[$read_only]($read_only_style)[git $before_root_path]($before_repo_root_style)[ $repo_root]($repo_root_style)[$path]($style)[](bright-black)'
read_only = "ReadOnly "
read_only_style = "fg:bright-red bg:bright-black"
use_os_path_sep = false

[git_branch]
style = 'fg:bright-white bg:purple'
format = ' [](purple)[$symbol$branch(:$remote_branch) ]($style)'

[git_state]
style = 'fg:bright-white bg:cyan'
format = '[ $state( $progress_current/$progress_total) ]($style)'

[git_status]
up_to_date = "O"
style = 'fg:bright-white bg:blue'
format = '([ $all_status$ahead_behind]($style))[](blue)'

[username]
style_user = 'fg:bright-white bg:bright-black'
style_root = 'fg:bright-red bg:bright-black'
format = ' [](bright-black)[$user ]($style)'
disabled = false

[hostname]
style = 'fg:black bg:cyan'
format = '[ @$hostname]($style)[](cyan)'

[package]
format = ' [](cyan)[v$version](fg:black bg:cyan)[](cyan)'
version_format = '${raw}'

#
# Package Versions
#

[docker_context]
disabled = true

[container]
disabled = true

[cmake]
format = ' [](bright-purple)[CMake@$version](fg:black bg:bright-purple)[](bright-purple)'
version_format = '${raw}'

[deno]
format = ' [](black)[Deno@$version](fg:bright-white bg:black)[](black)'
version_format = '${raw}'

[rust]
format = ' [](bright-yellow)[Rust@$version](fg:black bg:bright-yellow)[](bright-yellow)'
version_format = '${raw}'

[nodejs]
format = ' [](green)[NodeJS@$version](fg:black bg:green)[](green)'
version_format = '${raw}'

[python]
format = ' [](blue)[Python@$version](fg:bright-white bg:blue)[](blue)'
version_format = '${raw}'

[golang]
format = ' [](bright-cyan)[Go@$version](fg:black bg:bright-cyan)[](bright-cyan)'
version_format = '${raw}'

[ruby]
format = ' [](red)[Ruby@$version](fg:bright-white bg:red)[](red)'
version_format = '${raw}'

[java]
format = ' [](red)[Java@$version](fg:bright-white bg:red)[](red)'
version_format = '${raw}'

[zig]
format = ' [](yellow)[Zig@$version](fg:black bg:yellow)[](yellow)'
version_format = '${raw}'

[mojo]
format = ' [](red)[Mojo@$version](fg:bright-white bg:red)[](red)'

[conda]
format = ' [](green)[CondaVENV](fg:bright-white bg:green)[](green)'

[swift]
format = ' [](cyan)[Swift@$version](fg:bright-white bg:cyan)[](cyan)'

[dotnet]
format = ' [](green)[.NET@$version/$tfm](fg:bright-white bg:green)[](green)'

[haskell]
format = ' [](purple)[Haskell@$version](fg:bright-white bg:purple)[](purple)'

# TODO: Wait for conditional styling support
[status]
style = 'bg:red fg:bright-white'
symbol = "ERROR"
success_symbol = ""
not_executable_symbol = "NOT EXEC"
not_found_symbol = "NOT FOUND"
sigint_symbol = "SIGINT"
format = ' [](red)[$symbol(@$status_number)]($style)[](red)'
map_symbol = true
disabled = false

[cmd_duration]
style = "bg:bright-black fg:bright-white"
min_time = 1000
format = ' [](bright-black)[$duration]($style)[](bright-black)'
disabled = false
